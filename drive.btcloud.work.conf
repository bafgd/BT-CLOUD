# Reverse proxy for OpenCloud, running via the opencloud-eu/opencloud-compose
# docker compose stack, listening on its default port 9200.
#
# If OpenCloud runs on a different machine than this nginx box, replace
# 127.0.0.1 with that machine's LAN IP in the proxy_pass line, and use the
# "-exposed" compose file variant on that machine (see the setup guide).

server {
    listen 80;
    listen [::]:80;
    server_name drive.btcloud.work;

    location / {
        proxy_pass http://127.0.0.1:9200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
