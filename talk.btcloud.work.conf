# Reverse proxy for Stoat (formerly Revolt), running via the stoatchat/self-hosted
# docker compose stack. Replace 1234 below with whatever port generate_config.sh
# reports back to you when you tell it you're using an external reverse proxy.
#
# If Stoat runs on a different machine than this nginx box, replace 127.0.0.1
# with that machine's LAN IP in all three proxy_pass lines below.

server {
    listen 80;
    listen [::]:80;
    server_name talk.btcloud.work;

    # Normal HTTP traffic (web app, API calls, file uploads)
    location / {
        proxy_pass http://127.0.0.1:1234;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Realtime event socket - needs the Upgrade/Connection headers or
    # messages/typing indicators won't arrive live
    location /ws {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Voice/video call signaling - same upgrade requirement.
    # Note: the actual call media (UDP) does NOT go through nginx at all,
    # see the setup guide for the extra port forwards this needs.
    location /livekit {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
